[project]
name = "fruitninja"
version = "0.1.0"
description = "KUKA iiwa fruit slicing: RL vs. trajectory optimization"
requires-python = ">=3.12"
dependencies = [
    "mjlab==1.6.0",
]

# mjlab discovers task packages through this entry-point group and imports them,
# which registers our tasks. This is what makes `uv run train Fruitninja-...` work.
[project.entry-points."mjlab.tasks"]
fruitninja = "fruitninja_rl.tasks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fruitninja_common", "src/fruitninja_rl"]
